<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>msync</title>
<style>
:root {
    --bg: #0d1117; --surface: #161b22; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
    --green: #3fb950; --red: #f85149; --yellow: #d29922;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, 'Segoe UI', Roboto, monospace; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* Header / Now Playing */
.header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
.header h1 { font-size: 16px; font-weight: 600; color: var(--accent); white-space: nowrap; }
.now-playing { flex: 1; min-width: 0; }
.now-playing .title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.now-playing .album { font-size: 12px; color: var(--muted); }
.now-playing .time { font-size: 11px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
.now-playing .progress { height: 4px; background: var(--border); border-radius: 2px; margin-top: 6px; overflow: hidden; max-width: 560px; }
.now-playing .progress-fill { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), #79c0ff); border-radius: 2px; }
.controls { display: flex; gap: 6px; flex-shrink: 0; }
.controls button { background: var(--surface); border: 1px solid var(--border); color: var(--text); width: 34px; height: 34px; border-radius: 6px; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
.controls button:hover { border-color: var(--accent); color: var(--accent); }
.controls button.play-btn { width: 40px; background: var(--accent); border-color: var(--accent); color: #fff; }
.controls button.play-btn:hover { background: #79c0ff; }

/* Main panels */
.main { flex: 1; display: flex; overflow: hidden; }
.panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

/* Tabs */
.tabbar { display: flex; gap: 4px; padding: 6px 12px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.tab { background: none; border: 1px solid transparent; color: var(--muted); padding: 4px 12px; border-radius: 5px; cursor: pointer; font-size: 12px; font-family: inherit; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-color: var(--border); background: var(--bg); font-weight: 600; }

/* Configure tab content */
.configure { padding: 16px; overflow-y: auto; }
.configure h3 { font-size: 13px; margin: 12px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
.client-row { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 12px; }
.client-row .client-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.client-row .client-name { font-size: 15px; font-weight: 600; }
.client-row .client-ip { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.client-row .client-status { margin-left: auto; font-size: 11px; color: var(--muted); }
.client-row .client-status.online { color: var(--green); }
.client-row .client-status.offline { color: var(--red); }
.client-row .client-err { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; cursor: help; }
.slider-row { display: flex; align-items: center; gap: 14px; }
.slider-row input[type=range] { flex: 1; -webkit-appearance: none; height: 4px; border-radius: 2px; background: var(--border); outline: none; }
.slider-row input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); cursor: pointer; border: none; }
.slider-row input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); cursor: pointer; border: none; }
.slider-row .lat-num { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
.slider-row .lat-num input[type=number] { width: 74px; text-align: right; font: inherit; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--accent); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; }
.slider-row .lat-num input[type=number]:focus { outline: none; border-color: var(--accent); }
.slider-row .lat-num input[type=number]::-webkit-outer-spin-button,
.slider-row .lat-num input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.slider-row .lat-num input[type=number] { -moz-appearance: textfield; appearance: textfield; }
.slider-row .lat-unit { font-size: 12px; color: var(--muted); }
.slider-centre { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-top: 2px; }
.empty-state { color: var(--muted); text-align: center; padding: 24px; font-size: 12px; }

/* Catalog scan progress (shown while the server indexes/refreshes the library) */
.scan-banner {
    background: rgba(88,166,255,0.12);
    color: var(--accent);
    font-size: 11px;
    text-align: center;
    padding: 5px 12px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.scan-banner[hidden] { display: none; }
.scan-banner .spinner { display: inline-block; margin-right: 6px;
    vertical-align: -1px; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Toasts: fleeting status messages (bottom-right, auto-dismiss) */
#toasts {
    position: fixed; right: 16px; bottom: 16px; z-index: 100;
    display: flex; flex-direction: column; gap: 8px;
    pointer-events: none; max-width: min(380px, calc(100vw - 32px));
}
.toast {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.45);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: auto;   /* container is click-through; toasts themselves aren't */
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast.warn { border-left-color: var(--yellow); }
.toast.error { border-left-color: var(--red); }
.toast .toast-close { float: right; margin-left: 8px; color: var(--muted); cursor: pointer; user-select: none; }

.panel-header { padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.panel-header h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); flex-shrink: 0; }
.panel-header .count { font-size: 11px; color: var(--muted); }
.search-box { flex: 1; position: relative; }
.search-box input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 4px 28px 4px 24px; border-radius: 4px; font-size: 12px; outline: none; font-family: inherit; }
.search-box input:focus { border-color: var(--accent); }
.search-box .search-icon { position: absolute; left: 6px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search-clear { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--muted); font-size: 12px; line-height: 1; padding: 3px 6px; border-radius: 4px; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity 0.15s; }
.search-clear:hover { color: var(--text); background: var(--border); }
.search-clear.show { opacity: 1; pointer-events: auto; }
.head-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 11px; font-family: inherit; padding: 4px 6px; border-radius: 4px; flex-shrink: 0; transition: all 0.15s; }
.head-btn:hover { color: var(--text); background: var(--border); }
.head-btn.accent { color: var(--accent); }
.head-btn.accent:hover { color: var(--accent); }
.head-btn[disabled] { opacity: 0.5; cursor: default; }

.scroll { flex: 1; overflow-y: auto; padding: 4px 0; }
.scroll::-webkit-scrollbar { width: 6px; }
.scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* Track list */
.track-item { padding: 6px 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 13px; transition: background 0.1s; border-left: 3px solid transparent; }
.track-item:hover { background: rgba(88,166,255,0.08); }
.track-item.playing { background: rgba(88,166,255,0.12); border-left-color: var(--accent); }
.track-item .num { color: var(--muted); font-size: 11px; min-width: 20px; text-align: right; font-variant-numeric: tabular-nums; }
.track-item .name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track-item .name .album-label { color: var(--muted); font-size: 11px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* Play / queue action buttons on tracks and album headers */
.track-item .badge,
.album-group-header .badge { font-size: 10px; padding: 1px 5px; border-radius: 3px; background: var(--border); color: var(--muted); cursor: pointer; user-select: none; flex-shrink: 0; }
.track-item .badge:hover,
.album-group-header .badge:hover { background: var(--accent); color: #fff; }

/* Album groups */
.album-group { margin-bottom: 2px; }
.album-group-header { padding: 6px 12px; font-size: 12px; font-weight: 600; color: var(--accent); cursor: pointer; display: flex; align-items: center; gap: 6px; user-select: none; }
.album-group-header:hover { background: rgba(88,166,255,0.05); }
.album-group-header .arrow { transition: transform 0.15s; font-size: 10px; }
.album-group-header .arrow.open { transform: rotate(90deg); }
.album-group-header .album-count { color: var(--muted); font-weight: normal; font-size: 11px; }

/* Queue items */
.queue-item { padding: 6px 12px; display: flex; align-items: center; gap: 8px; font-size: 13px; transition: background 0.1s; }
.queue-item:hover { background: rgba(88,166,255,0.08); }
.queue-item.now-playing { background: rgba(88,166,255,0.1); }
.queue-item.now-playing .name { font-weight: 600; }
.queue-item .idx { color: var(--muted); font-size: 11px; min-width: 16px; text-align: right; }
.queue-item .name { flex: 1; min-width: 0; white-space: normal; overflow-wrap: anywhere; }
.queue-item .remove { opacity: 0; color: var(--red); cursor: pointer; font-size: 14px; transition: opacity 0.15s; }
.queue-item:hover .remove { opacity: 1; }
/* Drag handle (mouse, pen, and touch — touch-action:none keeps the gesture
   owned by the row so the page doesn't scroll mid-drag). */
.queue-item .grip {
    cursor: grab; color: var(--muted); font-size: 13px; line-height: 1;
    padding: 4px 4px; margin-left: -6px; flex-shrink: 0;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none;
}
.queue-item .grip:hover { color: var(--accent); }
.queue-item .grip:active { cursor: grabbing; }
/* SortableJS drag state: the drop-placeholder slot, the row being dragged
   (dimmed while its ghost floats after the pointer), and the ghost itself. */
.sortable-ghost { opacity: 0.45; }
.sortable-ghost .grip { visibility: hidden; }
.sortable-chosen { background: rgba(88,166,255,0.15); }
.sortable-drag { opacity: 0.3; }
.queue-ghost {
    position: fixed; z-index: 1000; pointer-events: none;
    background: var(--surface); border: 1px solid var(--accent);
    border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    opacity: 0.95; margin: 0;
    cursor: grabbing;
}

.empty { text-align: center; padding: 24px; color: var(--muted); font-size: 12px; }

/* Scrollbar visible on hover */
.scroll:hover::-webkit-scrollbar-thumb { background: #484f58; }

/* ── Responsive: tablets & phones ───────────────────────────────────── */
@media (max-width: 640px) {          /* phones */
    body { height: 100dvh; }
    .header { flex-wrap: wrap; gap: 8px 12px; padding: 10px 12px; }
    .now-playing { min-width: 0; }
    .controls { flex-basis: 100%; justify-content: center; }
    .controls button { width: 38px; height: 38px; font-size: 16px; }
    .now-playing .progress { max-width: none; }
}

/* ── Touch/tablet (phone & tablet): larger, spaced, always-visible targets ─ */
@media (max-width: 1024px), (hover: none) and (pointer: coarse) {
    .track-item,
    .album-group-header,
    .queue-item { padding-top: 12px; padding-bottom: 12px; }
    .track-item,
    .queue-item { gap: 12px; }
    .album-group-header { gap: 10px; }
    .album-group-header .badge + .badge { margin-left: 6px; }
    .controls button,
    .controls button.play-btn { width: 44px; height: 44px; font-size: 20px; }
    .track-item .badge,
    .album-group-header .badge {
        min-width: 48px; min-height: 44px;
        font-size: 19px;
        padding: 6px 10px;
        display: inline-flex; align-items: center; justify-content: center;
        border-radius: 8px;
    }
    .queue-item .remove {
        opacity: 1;   /* touch screens have no hover to reveal the button */
        font-size: 18px;
        padding: 6px 12px;
        border-radius: 8px;
        background: var(--border);
    }
    .queue-item .grip {
        font-size: 20px;
        padding: 10px 14px;
        margin-left: -10px;
    }
    .search-clear {
        font-size: 18px;
        padding: 6px 10px;
        border-radius: 8px;
    }
    .head-btn {
        font-size: 16px;
        padding: 8px 12px;
    }
}

/* ── Embiggen: bigger text on tablets & phones ─────────────────────── */
@media (max-width: 820px), (hover: none) and (pointer: coarse) {
    .now-playing .title { font-size: 17px; }
    .now-playing .album { font-size: 13px; }
    .now-playing .time { font-size: 12px; }
    .tab { font-size: 13px; }
    .panel-header h2 { font-size: 13px; }
    .panel-header .count { font-size: 12px; }
    .search-box input { font-size: 14px; }
    .track-item { font-size: 17px; }
    .track-item .num { font-size: 13px; }
    .track-item .name .album-label { font-size: 13px; }
    .album-group-header { font-size: 16px; }
    .album-group-header .arrow { font-size: 13px; }
    .album-group-header .album-count { font-size: 13px; }
    .queue-item { font-size: 17px; }
    .queue-item .idx { font-size: 13px; }
    .queue-item .remove { font-size: 18px; }
    .empty { font-size: 14px; }
    .empty-state { font-size: 14px; }
    .configure h3 { font-size: 14px; }
    .client-row .client-name { font-size: 16px; }
    .client-row .client-ip { font-size: 13px; }
    .client-row .client-status { font-size: 12px; }
    .client-row .client-err { font-size: 12px; }
    .slider-row .lat-num { font-size: 13px; }
    .slider-row .lat-num input[type=number] { font-size: 15px; }
    .slider-centre { font-size: 12px; }
    .slider-row .lat-unit { font-size: 13px; }
    .head-btn { font-size: 16px; }
}
/* Extra legibility on phones */
@media (max-width: 640px) {
    .search-box input { font-size: 16px; }   /* ≥16px stops iOS auto-zoom on focus */
    .track-item { font-size: 18px; }
    .track-item .num { font-size: 14px; }
    .queue-item { font-size: 18px; }
    .album-group-header { font-size: 17px; }
}
</style>
</head>
<body>

<!-- Header: Now Playing + Controls -->
<div class="header">
    <h1>▶ msync</h1>
    <div class="now-playing">
        <div class="title" id="np-title">—</div>
        <div class="album" id="np-album"></div>
        <div class="time" id="np-time"></div>
        <div class="progress"><div class="progress-fill" id="np-progress"></div></div>
    </div>
    <div class="controls">
        <button onclick="control('prev')" title="Previous">⏮</button>
        <button class="play-btn" id="btn-play" onclick="control('toggle')" title="Play/Pause">▶</button>
        <button onclick="control('next')" title="Next">⏭</button>
        <button onclick="control('stop')" title="Stop">⏹</button>
    </div>
</div>

<!-- Tab bar -->
<div class="tabbar">
    <button class="tab active" data-tab="search" onclick="setTab('search')">Search</button>
    <button class="tab" data-tab="queue" onclick="setTab('queue')">Queue</button>
    <button class="tab" data-tab="config" onclick="setTab('config')">Configure</button>
</div>

<!-- Catalog scan progress (hidden unless the server is indexing) -->
<div class="scan-banner" id="scan-banner" hidden>
    <span class="spinner">⟳</span><span id="scan-text"></span>
</div>

<!-- Search view: Library -->
<div class="main" id="view-search">
    <div class="panel">
        <div class="panel-header">
            <h2>Library</h2>
            <span class="count" id="lib-count"></span>
            <div class="search-box">
                <svg class="search-icon" width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M11.5 7a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0Zm-.82 4.74a6 6 0 1 1 1.06-1.06l3.04 3.04a.75.75 0 1 1-1.06 1.06l-3.04-3.04Z"/></svg>
                <input type="text" id="search" placeholder="Search songs or albums…" autocomplete="off">
                <button class="search-clear" id="search-clear" type="button" onclick="clearSearch()" title="Clear search" aria-label="Clear search">✕</button>
            </div>
        </div>
        <div class="scroll" id="library"></div>
    </div>
</div>

<!-- Queue view -->
<div class="main" id="view-queue" style="display:none;">
    <div class="panel">
        <div class="panel-header">
            <h2>Queue</h2>
            <span class="count" id="queue-count"></span>
            <button class="head-btn accent" id="btn-party" onclick="partyMode()" title="Add 50 random songs to the queue" style="margin-left:auto;">🎉 Party</button>
            <button class="head-btn" onclick="queueClear()" title="Clear queue">clear</button>
        </div>
        <div class="scroll" id="queue"></div>
    </div>
</div>

<!-- Configure view: per-room latency -->
<div class="main" id="view-config" style="display:none;">
    <div class="configure" id="configure"></div>
</div>

<script src="static/sortable.min.js"></script>
<script>
let state = { queue: [], now_playing: null, paused: false, elapsed: 0, duration: 0 };
let library = { songs: [], albums: [], singles: [] };
let openAlbums = {};  // album name -> true/false once the user toggled it (undefined = never toggled; use the search default)
const NP_KEY = '__np__';  // sentinel for now-playing slot in queue

// ── API helpers ──────────────────────────────────────────────────────
async function api(method, path, body) {
    const opts = { method, headers: {} };
    if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
    try {
        const r = await fetch(path, opts);
        return await r.json();
    } catch(e) { return { error: e.message }; }
}

// ── Toasts ───────────────────────────────────────────────────────────
// Fleeting status messages: slide up in the corner, auto-dismiss, and
// float-close. kind: 'warn' / 'error' / undefined (default/accent).
function toast(msg, kind, ms) {
    const box = document.getElementById('toasts');
    const el = document.createElement('div');
    el.className = 'toast' + (kind ? ' ' + kind : '');
    const close = document.createElement('span');
    close.className = 'toast-close';
    close.textContent = '✕';
    close.onclick = () => dismiss();
    el.appendChild(close);
    el.appendChild(document.createTextNode(msg));
    box.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    let timer = null;
    function dismiss() {
        if (!el.isConnected) return;
        clearTimeout(timer);
        el.classList.remove('show');
        el.addEventListener('transitionend', () => el.remove(), { once: true });
        setTimeout(() => el.remove(), 600);   // safety net
    }
    timer = setTimeout(dismiss, ms || 2600);
}

// Last path segment (a queue relpath -> human display name).
function shortName(p) {
    const parts = String(p).split('/');
    return parts[parts.length - 1];
}

// ── Tabs ─────────────────────────────────────────────────────────────
let currentTab = 'search';
function setTab(name) {
    currentTab = name;
    document.querySelectorAll('.tab').forEach(b =>
        b.classList.toggle('active', b.dataset.tab === name));
    document.getElementById('view-search').style.display = name === 'search' ? '' : 'none';
    document.getElementById('view-queue').style.display = name === 'queue' ? '' : 'none';
    document.getElementById('view-config').style.display = name === 'config' ? '' : 'none';
    if (name === 'config') fetchClients();
}

// ── Configure: per-room latency ──────────────────────────────────────
let clients = [];
let currentLatency = {};          // ip -> last server-confirmed ms (Escape restores to this)
let pendingLatency = {};          // ip -> {v, t}: locally-set value awaiting server echo

async function fetchClients() {
    const d = await api('GET', '/api/clients');
    if (d.error) return;
    const prev = clients;
    const next = d.clients || [];
    for (const c of next) {
        currentLatency[c.ip] = Math.round(c.latency_ms || 0);
        const p = pendingLatency[c.ip];
        if (p && p.v === currentLatency[c.ip]) delete pendingLatency[c.ip];
    }
    // Full rebuild only when the room SET changes; otherwise update rows in
    // place so an in-flight drag or a half-typed number is never interrupted.
    const setChanged = next.length !== prev.length ||
        next.some(c => !prev.some(o => o.ip === c.ip)) ||
        prev.some(c => !next.some(o => o.ip === c.ip));
    clients = next;
    if (setChanged) renderClients(); else updateClientRows();
}

function clientStatus(c) {
    const now = Date.now() / 1000;
    const fresh = (c.last_seen > 0) && (now - c.last_seen) < 15;
    return fresh ? 'online' : 'offline';
}

// Live sync-error badge: the same `err` the client prints, in ms. Hidden
// (dashed) when the room is offline so a stale number isn't misleading.
function errText(c, status) {
    if (status === 'offline') return 'err –';
    const v = c.err_ms;
    if (typeof v !== 'number' || !isFinite(v)) return 'err –';
    const sign = v >= 0 ? '+' : '';
    return 'err ' + sign + (Math.round(Math.abs(v) * 10) / 10).toFixed(1) + ' ms';
}

function renderClients() {
    const el = document.getElementById('configure');
    if (!clients.length) {
        el.innerHTML = '<div class="empty-state">No clients have connected yet. Start the msync client on a room and it will appear here.</div>';
        return;
    }
    let html = '<h3>Rooms / output-latency offset</h3>' +
        '<div class="empty-state" style="padding:8px 0 16px;">' +
        'Set how many ms each room must play <b>ahead</b> of the sync timeline to ' +
        'line up with the others (negative = behind). Drag the slider or type an ' +
        'exact value; applied live and saved to the database.</div>';
    for (const c of clients) {
        const key = c.ip.replace(/\./g, '_');
        const status = clientStatus(c);
        const name = c.hostname || c.ip;
        const lat = Math.round(c.latency_ms || 0);
        html += `
        <div class="client-row">
            <div class="client-head">
                <span class="client-name">${esc(name)}</span>
                <span class="client-ip">${esc(c.ip)}</span>
                <span class="client-err" id="err-${key}"
                    title="Sync error: how far this room's playback is from the server timeline (updates on each 10 s re-register)">${errText(c, status)}</span>
                <span class="client-status ${status}" id="status-${key}">● ${status}</span>
            </div>
            <div class="slider-row">
                <span style="font-size:11px;color:var(--muted)">-1000</span>
                <input type="range" id="slider-${key}" min="-1000" max="1000" step="1" value="${lat}"
                    oninput="sliderInput('${esc(c.ip)}', this)"
                    onchange="sliderCommit('${esc(c.ip)}', this)"
                    onmousedown="this.dataset.active='1'" ontouchstart="this.dataset.active='1'"
                    onkeydown="this.dataset.active='1'" onblur="this.dataset.active='0'">
                <span style="font-size:11px;color:var(--muted)">+1000</span>
                <div class="lat-num">
                    <input type="number" id="num-${key}" min="-1000" max="1000" step="1" value="${lat}"
                        onchange="numCommit('${esc(c.ip)}', this)"
                        onkeydown="numKey('${esc(c.ip)}', this, event)"
                        title="Click and type an exact value (Enter or click away to apply)">
                    <span>ms</span>
                </div>
            </div>
            <div class="slider-centre"><span>← plays late · plays ahead →</span><span class="lat-unit">offset (ms)</span></div>
        </div>`;
    }
    el.innerHTML = html;
    updateClientRows();
}

// Refresh each row in place (status + values of idle controls) without
// rebuilding the DOM, so an active drag or a half-typed number survives.
function updateClientRows() {
    const now = Date.now() / 1000;
    for (const c of clients) {
        const key = c.ip.replace(/\./g, '_');
        const p = pendingLatency[c.ip];
        const lat = (p && (Date.now() - p.t) < 4000)
            ? p.v : Math.round(c.latency_ms || 0);
        const sl = document.getElementById('slider-' + key);
        if (sl && sl.dataset.active !== '1' && sl.value !== String(lat)) sl.value = lat;
        const num = document.getElementById('num-' + key);
        if (num && document.activeElement !== num &&
            String(num.value || 0) !== String(lat)) num.value = lat;
        const st = document.getElementById('status-' + key);
        const fresh = (c.last_seen > 0) && (now - c.last_seen) < 15;
        const cls = fresh ? 'online' : 'offline';
        if (st) {
            if (st.textContent !== '● ' + cls) {
                st.className = 'client-status ' + cls;
                st.textContent = '● ' + cls;
            }
        }
        const er = document.getElementById('err-' + key);
        if (er) {
            const txt = errText(c, cls);
            if (er.textContent !== txt) er.textContent = txt;
        }
    }
}

// Slider: mirror into the number box live; persist only on release.
function sliderInput(ip, el) {
    el.dataset.active = '1';
    const num = document.getElementById('num-' + ip.replace(/\./g, '_'));
    if (num && document.activeElement !== num) num.value = el.value;
}

function sliderCommit(ip, el) {
    el.dataset.active = '0';
    const ms = clampLatency(Math.round(parseFloat(el.value) || 0));
    el.value = ms;
    const num = document.getElementById('num-' + ip.replace(/\./g, '_'));
    if (num) num.value = ms;
    commitLatency(ip, ms);
}

// Number box: exact 1 ms entry. Applies on Enter or focus loss.
function numCommit(ip, el) {
    const ms = clampLatency(Math.round(parseFloat(el.value) || 0));
    el.value = ms;
    const sl = document.getElementById('slider-' + ip.replace(/\./g, '_'));
    if (sl) sl.value = ms;
    commitLatency(ip, ms);
}

function numKey(ip, el, ev) {
    if (ev.key === 'Enter') { el.blur(); }          // blur fires change -> commit
    else if (ev.key === 'Escape') {
        el.value = currentLatency[ip] || 0;         // discard, back to committed
        el.blur();
    }
}

function clampLatency(ms) {
    return Math.max(-1000, Math.min(1000, ms));
}

// Debounced per-room push to the server (drag/keyboard chatter -> one send).
const latencyTimers = {};
function commitLatency(ip, ms) {
    clearTimeout(latencyTimers[ip]);
    latencyTimers[ip] = setTimeout(async () => {
        currentLatency[ip] = ms;
        pendingLatency[ip] = { v: ms, t: Date.now() };
        await api('POST', '/api/clients/latency', { ip, ms });
    }, 250);
}

async function fetchLibrary() {
    const d = await api('GET', '/api/library');
    if (d.error) return;
    library = d;
    precomputeSearchKeys();
    renderLibrary();
}

// Precompute lowercase search keys once per library fetch so each keystroke's
// filter is a plain substring check instead of lowercasing every field of
// every row. '\n' separates fields so a match can't span a field boundary.
function precomputeSearchKeys() {
    for (const s of library.singles || [])
        s._l = ((s.title || '') + '\n' + (s.relpath || '') + '\n' + (s.artist || '')).toLowerCase();
    for (const alb of library.albums || []) {
        alb._al = ((alb.album || '') + '\n' + (alb.artist || '')).toLowerCase();
        for (const t of alb.tracks || [])
            t._l = ((t.title || '') + '\n' + (t.relpath || '')).toLowerCase();
    }
}

async function fetchState() {
    const d = await api('GET', '/api/state');
    if (d.error) return;
    state = d;
    updateHeader();
    updateScanStatus();
    renderQueue();
}

// Show a slim banner while the server scans/indexes the music folder (e.g. a
// fresh catalog). The page otherwise renders as normal — partial results just
// appear in the library as the scan checkpoints them in.
function updateScanStatus() {
    const banner = document.getElementById('scan-banner');
    const text = document.getElementById('scan-text');
    const cs = state.catalog_scan;
    if (cs && cs.running && cs.total) {
        text.textContent = `Indexing your music… ${cs.done.toLocaleString()} / ${cs.total.toLocaleString()}`;
        banner.hidden = false;
    } else {
        banner.hidden = true;
    }
}

function control(action) { api('POST', `/api/control/${action}`); }
function playSong(name) { api('POST', `/api/control/play`, { name }); }
async function queueAdd(name) {
    const d = await api('POST', '/api/queue/add', { name });
    if (d.error) { toast(d.error, 'error'); return; }
    const added = d.added || [];
    if (added.length) {
        toast(added.length === 1
            ? `Added to queue — ${shortName(added[0])}`
            : `Added ${added.length} tracks to queue`);
        fetchState();
    }
    // Duplicates are rejected silently by the server: nothing to show.
}
function queueClear() { api('POST', '/api/queue/clear'); }

// Party mode: shuffle the whole collection and dump 50 random tracks (or all,
// if the library is smaller) into the queue in one request.
async function partyMode() {
    const all = library.songs || [];
    if (!all.length) return;
    const btn = document.getElementById('btn-party');
    btn.disabled = true;
    btn.textContent = 'Adding…';
    try {
        const names = pickRandom(all, 50);
        const d = await api('POST', '/api/queue/add', { names });
        if (d.error) { toast(d.error, 'error'); return; }
        const added = d.added || [];
        if (added.length) {
            toast(`🎉 ${added.length} random track${added.length === 1 ? '' : 's'} added to queue`);
            fetchState();   // refresh the queue list
        }
    } finally {
        btn.disabled = false;
        btn.textContent = '🎉 Party';
    }
}

// Fisher–Yates shuffle, then take the first n (picks without replacement).
function pickRandom(arr, n) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a.length <= n ? a : a.slice(0, n);
}
async function queueRemove(index) {
    const d = await api('DELETE', `/api/queue/remove?index=${index}`);
    if (d.error || d.removed === undefined) return;
    // Optimistic splice gives instant feedback; fetchState reconciles with
    // the authoritative server state (album entries etc.).
    if (state.queue && index >= 0 && index < state.queue.length) {
        state.queue.splice(index, 1);
        renderQueue();
    }
    fetchState();
}

function removeNowPlaying() {
    // The current track is never in the pending queue (it's popped before
    // playback starts), so removing it means skipping it: the next queued
    // song starts, or the next playlist track if the queue is empty — the
    // same as when a track ends naturally.
    api('POST', '/api/control/next');
}

// ── Header ───────────────────────────────────────────────────────────
// npElapsed rolls forward between 1s state polls so the progress bar is smooth.
let npElapsed = 0;

function updateProgress() {
    const fill = document.getElementById('np-progress');
    const dur = state.duration || 0;
    const pct = dur > 0 ? Math.min(100, Math.max(0, npElapsed / dur * 100)) : 0;
    fill.style.width = pct + '%';
}

function updateHeader() {
    const np = state.now_playing;
    const title = document.getElementById('np-title');
    const album = document.getElementById('np-album');
    const time = document.getElementById('np-time');
    const btn = document.getElementById('btn-play');

    if (np) {
        title.textContent = np.title || np.name;
        const sub = [np.artist, np.album].filter(Boolean).join(' — ');
        album.textContent = sub || '';
        btn.textContent = state.paused ? '▶' : '⏸';
        npElapsed = state.elapsed || 0;
        const dur = state.duration || 0;
        time.textContent = `${fmt(npElapsed)} / ${fmt(dur)}`;
        updateProgress();
    } else {
        title.textContent = '—';
        album.textContent = '';
        time.textContent = '';
        btn.textContent = '▶';
        npElapsed = 0;
        updateProgress();
    }
}

// Smooth progress between polls: advance npElapsed each animation frame
// while playing, so the bar/time glide instead of jumping once per second.
let frameLast = performance.now();
function progressFrame(now) {
    requestAnimationFrame(progressFrame);
    const dt = (now - frameLast) / 1000;
    frameLast = now;
    if (state.now_playing && !state.paused && (state.duration || 0) > 0) {
        npElapsed = Math.min(npElapsed + dt, state.duration);
        document.getElementById('np-time').textContent =
            `${fmt(npElapsed)} / ${fmt(state.duration)}`;
        updateProgress();
    }
}
requestAnimationFrame(progressFrame);

function fmt(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${s.toString().padStart(2, '0')}`;
}

// ── Library rendering ────────────────────────────────────────────────
function renderLibrary() {
    const el = document.getElementById('library');
    const q = (document.getElementById('search').value || '').toLowerCase().trim();
    const isSearch = !!q;
    // Highlight the current track. Use the full relpath so album tracks
    // (whose display name is just the basename) match too.
    const np = state.now_playing
        ? (state.now_playing.relpath || state.now_playing.name) : '';

    // Natural sort key
    function nk(s) { return s.replace(/\d+/g, m => m.padStart(10, '0')).toLowerCase(); }

    let html = '';

    // Singles
    const singles = (library.singles || []).filter(s =>
        !q || (s._l || '').includes(q));
    if (singles.length) {
        for (const s of singles) {
            const playing = s.relpath === np ? ' playing' : '';
            html += `<div class="track-item${playing}" onclick="playSong('${esc(s.relpath)}')" title="${esc(s.relpath)}">
                <span class="name">${esc(s.title)}</span>
                <span class="badge" onclick="event.stopPropagation();queueAdd('${esc(s.relpath)}')" title="Add to queue">+</span>
            </div>`;
        }
    }

    // Albums
    const albums = (library.albums || []).sort((a,b) => nk(a.album) < nk(b.album) ? -1 : 1);
    for (const alb of albums) {
        const tracks = alb.tracks || [];
        const visible = tracks.filter(t =>
            !q || (t._l || '').includes(q) || (alb._al || '').includes(q));
        if (q && !visible.length) continue;
        // When a search matches EVERY track of an album, the group shows
        // collapsed: the whole album is already under the header, so an
        // expanded list adds nothing. A partial match stays open so the
        // user sees exactly which tracks matched. Either way the header
        // stays tappable: an explicit click expands/collapses and wins.
        const isOpen = albumOpen(alb);
        const arrowCls = isOpen ? ' open' : '';
        const artistLabel = alb.artist ? esc(alb.artist) + ' · ' : '';
        html += `<div class="album-group">
            <div class="album-group-header" onclick="toggleAlbum('${esc(alb.album)}')">
                <span class="arrow${arrowCls}">▶</span>
                <span>${esc(alb.album)}</span>
                <span class="album-count">${artistLabel}${tracks.length} tracks</span>
                <span class="badge" onclick="event.stopPropagation();playSong('${esc(alb.album)}')" title="Play album">▶</span>
                <span class="badge" onclick="event.stopPropagation();albumQueue('${esc(alb.album)}')" title="Queue album">+</span>
            </div>`;
        if (isOpen) {
            for (let i = 0; i < visible.length; i++) {
                const t = visible[i];
                const playing = t.relpath === np ? ' playing' : '';
                // Search results show the album name under each track so a
                // match is unambiguous; plain browsing keeps rows compact
                // (the album is already the group header).
                const albumLine = isSearch
                    ? `<span class="album-label">${esc(alb.album)}</span>` : '';
                html += `<div class="track-item${playing}" onclick="playSong('${esc(t.relpath)}')" title="${esc(t.relpath)}">
                    <span class="num">${i + 1}</span>
                    <span class="name">${esc(t.title)}${albumLine}</span>
                    <span class="badge" onclick="event.stopPropagation();queueAdd('${esc(t.relpath)}')" title="Add to queue">+</span>
                </div>`;
            }
        }
        html += `</div>`;
    }

    if (!html) html = '<div class="empty">No matching tracks</div>';
    // Diff-guard: the library is re-fetched every 3s; don't rebuild the DOM
    // unless the rendered content actually changed (prevents flicker).
    if (el.innerHTML !== html) el.innerHTML = html;

    const total = (library.songs || []).length;
    document.getElementById('lib-count').textContent = q ? `${visible_count()} of ${total}` : total;
}

function visible_count() {
    return document.querySelectorAll('.track-item').length;
}

// Effective open state of an album group: an explicit user toggle always
// wins; otherwise a search shows partial matches open and full matches
// collapsed, and plain browsing starts collapsed.
function albumOpen(alb) {
    const name = alb.album;
    if (openAlbums[name] !== undefined) return openAlbums[name];
    const q = (document.getElementById('search').value || '').toLowerCase().trim();
    if (!q) return false;
    const tracks = alb.tracks || [];
    const visible = tracks.filter(t =>
        !q || (t._l || '').includes(q) || (alb._al || '').includes(q));
    return visible.length < tracks.length;   // partial match -> open
}

function toggleAlbum(name) {
    // Flip the CURRENTLY displayed state, so clicking an album that's open
    // by default (partial search match) collapses it, and one that's
    // collapsed by default (full search match) expands it.
    const alb = (library.albums || []).find(a => a.album === name);
    if (alb) openAlbums[name] = !albumOpen(alb);
    renderLibrary();
}

async function albumQueue(name) {
    // Queue every track of an album in one request (so a batch toast shows
    // once with the count, instead of one toast per track).
    const alb = (library.albums || []).find(a => a.album === name);
    if (!alb) return;
    const names = (alb.tracks || []).map(t => t.relpath);
    if (!names.length) return;
    const d = await api('POST', '/api/queue/add', { names });
    if (d.error) { toast(d.error, 'error'); return; }
    const added = d.added || [];
    if (added.length) {
        toast(`Added ${added.length} track${added.length === 1 ? '' : 's'} to queue — ${name}`);
        fetchState();
    }
}

// Escape for safe innerHTML injection. The value is used both in plain text
// nodes AND inside single-quoted JS strings in onclick handlers, so it must
// survive HTML parsing (strip < > & and the attribute delimiters) while a
// literal quote still can't terminate the JS string. Order matters: & must be
// escaped FIRST so the entities we emit below (&quot; &lt; &gt;) aren't
// re-escaped; then backslash/quote are escaped for the JS-string contexts.
function esc(s) {
    return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'");
}

// ── Queue rendering ──────────────────────────────────────────────────
let drag = false;   // true while a SortableJS drag is in flight (blocks renders)
let dragFrom = -1;  // dragged item's flat queue index when the drag started

function renderQueue() {
    const el = document.getElementById('queue');
    // An active drag manipulates the DOM node-by-node; rebuilding innerHTML
    // here would kill the gesture. The 1s poll still reconciles state.queue
    // meanwhile, and the drop commits the reorder to the server.
    if (drag) { updateQueueCount(); return; }
    const q = state.queue || [];
    const np = state.now_playing;

    let html = '';

    // Now-playing slot at top — removable like a queue item but not
    // draggable (it's never part of the pending queue itself). The current
    // track is popped before playback starts, so removing it starts the
    // next queued song.
    if (np) {
        const npLabel = [np.artist, np.album, np.title || np.name]
            .filter(Boolean).join(' - ') || np.name;
        html += `<div class="queue-item now-playing" data-np="1">
            <span class="grip" aria-hidden="true"></span>
            <span class="idx" style="color:var(--accent)">▶</span>
            <span class="name">${esc(npLabel)}</span>
            <span class="remove" onclick="removeNowPlaying()" title="Remove current song, start next">✕</span>
        </div>`;
    }

    for (let i = 0; i < q.length; i++) {
        const m = (state.queue_meta || [])[i];
        // Prefer tagged display metadata (artist - album - title); fall back
        // to the raw relpath when the server didn't provide it.
        const label = m
            ? [m.artist, m.album, m.title].filter(Boolean).join(' - ')
            : q[i];
        html += `<div class="queue-item">
            <span class="grip" title="Drag to reorder" aria-hidden="true">☰</span>
            <span class="idx">${i + 1}</span>
            <span class="name">${esc(label)}</span>
            <span class="remove" onclick="queueRemove(${i})" title="Remove">✕</span>
        </div>`;
    }

    if (!np && !q.length) html = '<div class="empty">Queue empty</div>';
    // Only touch the DOM when the queue actually changed: rebuilding via
    // innerHTML on every 1s poll destroys/recreates nodes (killing hover,
    // flushing CSS transitions) which looks like blinking.
    if (el.innerHTML !== html) el.innerHTML = html;
    updateQueueCount();
}

function updateQueueCount() {
    document.getElementById('queue-count').textContent = (state.queue || []).length;
}

// ── Queue drag & drop reordering (SortableJS) ────────────────────────
// SortableJS (vendored in static/sortable.min.js) handles mouse, pen, and
// touch in one library. forceFallback gives a consistent drag ghost on every
// device; `handle` restricts drags to the ☰ grip so taps/scrolls anywhere
// else on a row still work (touch-action:none on the grip keeps the gesture
// owned by the row on touch); `filter` pins the now-playing slot in place —
// and SortableJS ignores filtered rows when computing indices, so its
// indices line up 1:1 with the server's flat queue (queue_list()).
const queueEl = document.getElementById('queue');

Sortable.create(queueEl, {
    handle: '.grip',
    filter: '[data-np]',           // now-playing slot stays put (and uncounted)
    animation: 150,                // smooth live reordering
    forceFallback: true,           // own ghost on mouse AND touch (consistent)
    fallbackClass: 'queue-ghost',  // reuse .queue-ghost styling as the drag image
    ghostClass: 'sortable-ghost',
    chosenClass: 'sortable-chosen',
    dragClass: 'sortable-drag',
    scroll: true,                  // auto-scroll the container near its edges
    swapThreshold: 0.55,
    onStart(evt) {
        drag = true;
        dragFrom = flatQueueIndex(evt.item);
    },
    onUpdate() {
        refreshQueueNumbers();     // keep row numbers live while items swap
    },
    onEnd(evt) {
        const to = flatQueueIndex(evt.item);
        const from = dragFrom;
        drag = false;
        if (to === from || to < 0 || from < 0) return fetchState();  // no net move
        // Optimistic local reorder so the list doesn't snap back while the
        // server confirms; fetchState() then reconciles the authoritative
        // order (album entries may split/regroup server-side).
        const q = state.queue || [];
        if (from < q.length) {
            const [item] = q.splice(from, 1);
            if (item) q.splice(to, 0, item);
            const m = state.queue_meta || [];
            if (from < m.length) {
                const [meta] = m.splice(from, 1);
                if (meta) m.splice(to, 0, meta);
            }
            renderQueue();
        }
        api('POST', '/api/queue/move', { from, to }).then(() => fetchState());
    },
});

function flatQueueIndex(item) {
    // Flat queue index = position among real rows (the now-playing slot is
    // filtered out), which is exactly the server's index space.
    return [...queueEl.querySelectorAll('.queue-item:not([data-np])')]
        .indexOf(item);
}

function refreshQueueNumbers() {
    const rows = [...queueEl.querySelectorAll('.queue-item')];
    const start = state.now_playing ? 1 : 0;
    rows.forEach((row, i) => {
        const idxEl = row.querySelector('.idx');
        if (!idxEl) return;
        idxEl.textContent = row.dataset.np ? '▶' : (i - start + 1);
    });
}

// ── Search ───────────────────────────────────────────────────────────
// Show the ✕ clear button only while the box has text.
function updateClearBtn() {
    const box = document.getElementById('search');
    document.getElementById('search-clear').classList.toggle('show', box.value.length > 0);
}

function clearSearch() {
    const box = document.getElementById('search');
    box.value = '';
    updateClearBtn();
    renderLibrary();
    box.focus();
}

let searchTimer = null;
document.getElementById('search').addEventListener('input', () => {
    updateClearBtn();
    // Debounce: wait for a pause in typing before re-scanning the library,
    // so a fast-typed word doesn't run the filter once per keystroke.
    clearTimeout(searchTimer);
    searchTimer = setTimeout(renderLibrary, 120);
});

// ── Polling ──────────────────────────────────────────────────────────
async function tick() {
    await fetchState();
    if (currentTab === 'config') fetchClients();
}
tick();
setInterval(tick, 1000);
setInterval(fetchLibrary, 3000);

// Keyboard shortcuts
document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    switch(e.key) {
        case ' ': e.preventDefault(); control('toggle'); break;
        case 'n': control('next'); break;
        case 'p': control('prev'); break;
    }
});
</script>

<!-- Fleeting status messages (toasts) -->
<div id="toasts"></div>
</body>
</html>
